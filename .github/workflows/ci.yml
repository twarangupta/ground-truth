# Continuous integration: runs on every push to main and every pull request.
# No secrets or paid services are needed.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api-checks:
    name: Lint, type check, unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies exactly as locked
        run: uv sync --locked

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy

      - name: Unit tests
        run: uv run pytest -m "not integration"

  api-integration:
    name: Integration tests (real Postgres)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      postgres:
        image: pgvector/pgvector:0.8.1-pg16
        env:
          POSTGRES_USER: groundtruth
          POSTGRES_PASSWORD: groundtruth
          POSTGRES_DB: groundtruth
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U groundtruth -d groundtruth"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      APP_ENV: test
      DATABASE_URL: postgresql://groundtruth:groundtruth@localhost:5432/groundtruth
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies exactly as locked
        run: uv sync --locked

      - name: Integration tests
        run: uv run pytest -m integration
