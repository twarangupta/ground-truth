[project]
name = "groundtruth"
version = "0.1.0"
description = "GroundTruth API: a RAG assistant over public financial documents with an evaluation harness."
readme = "README.md"
authors = [
    { name = "Twaran Gupta", email = "twarangupta01@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "psycopg[binary]>=3.3.8",
    "pydantic-settings>=2.16.2",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/W: style errors, F: real bugs (unused imports, undefined names),
# I: import sorting, B: common bug patterns, UP: modern syntax, SIM: simplifications.
select = ["E", "W", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: needs a running Postgres (make db-up). Excluded from the default unit run.",
]
